[project]
name = "vaiddisha"
version = "0.1.0"
description = "AI Disease Predictor & Doctor Recommendation System"
readme = "README.md"
authors = [
    { name = "Gitesh-Ratnaparkhi", email = "giteshratnaparkhi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "country-state-city>=0.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "gradio>=6.24.0",
    "groq>=1.6.0",
    "plotly>=6.9.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
