[project]
name = "vaiddisha"
version = "0.1.0"
description = "AI Disease Predictor & Doctor Recommendation System"
readme = "README.md"
authors = [
    { name = "Gitesh-Ratnaparkhi", email = "giteshratnaparkhi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "country-state-city>=0.1.0",
    "email-validator>=2.3.0",
    "faster-whisper>=1.2.1",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
extraPaths = ["."]
